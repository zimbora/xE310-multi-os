name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'include/**'
              - 'CMakeLists.txt'
              - 'cmake/**'
              - '.github/workflows/ci.yml'
            tests:
              - 'src/**'
              - 'include/**'
              - 'tests/**'
              - 'CMakeLists.txt'
              - 'cmake/**'
              - '.github/workflows/ci.yml'

  dynamic-memory-policy:
    name: Dynamic Memory Policy
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check dynamic memory policy
        run: python3 scripts/check_dynamic_memory_policy.py

  clang-format:
    name: Code Formatting
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format (pinned)
        run: |
          python3 -m pip install --user clang-format==22.1.3
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Check clang-format
        run: clang-format --dry-run --Werror src/*.cpp src/hal/*.cpp include/modem/*.h

  clang-tidy:
    name: clang-tidy
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy (pinned)
        run: |
          python3 -m pip install --user clang-tidy==22.1.7
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Generate compile_commands.json
        run: cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          clang-tidy -p build --warnings-as-errors="*" \
            $(find src -maxdepth 1 -name '*.cpp' ! -name 'zephyr_main.cpp')

  cppcheck:
    name: Cppcheck Static Analysis
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=all \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=checkersReport \
            --suppress=unmatchedSuppression \
            --inline-suppr \
            --error-exitcode=1 \
            --std=c++17 \
            -I include \
            src/ include/

  tests:
    name: Unit Tests (Linux)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
