name: Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMODEM_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build

      - name: Stage outputs
        run: |
          mkdir -p out/lib out/bin
          cp build/libmodem_xe310.a out/lib/
          cp build/modem_app build/test_xe310 out/bin/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -DMODEM_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Stage outputs
        run: |
          mkdir out
          mkdir out\lib
          mkdir out\bin
          copy build\Release\modem_xe310.lib out\lib\
          copy build\Release\modem_app.exe out\bin\
          copy build\Release\test_xe310.exe out\bin\
        shell: cmd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  build-zephyr:
    name: Build Zephyr (nRF54L15)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.27.4
    env:
      ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains/zephyr-sdk-0.17.0
    steps:
      - uses: actions/checkout@v4

      - name: Install west and dependencies
        run: |
          pip3 install west

      - name: Initialize west workspace
        run: |
          west init -l .
          west update --narrow --fetch-opt=--depth=1

      - name: Build Zephyr firmware
        run: |
          west build -b nrf54l15dk/nrf54l15/cpuapp . --pristine

      - name: Stage outputs
        run: |
          mkdir -p out/firmware
          cp build/zephyr/zephyr.hex out/firmware/
          cp build/zephyr/zephyr.bin out/firmware/
          cp build/zephyr/zephyr.elf out/firmware/

      - name: Upload Zephyr artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zephyr
          path: out/
